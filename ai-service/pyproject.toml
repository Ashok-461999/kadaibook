[project]
name = "kadaibook-ai"
version = "0.1.0"
description = "KadaiBook vision extraction service"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:langgraph.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["evals/out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
